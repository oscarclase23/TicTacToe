name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-desktop:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install WiX
        run: choco install wixtoolset -y

      # 🔥 BUILD REAL (Usamos :composeApp: para asegurarnos de que construye el módulo correcto)
      - name: Build Installers
        run: |
          .\gradlew.bat clean
          .\gradlew.bat :composeApp:packageMsi
          .\gradlew.bat :composeApp:packageExe

      # 📦 PREPARAR ARCHIVOS
      - name: Prepare Artifacts
        shell: pwsh
        run: |
          mkdir artifacts -Force

          # Buscamos EXCLUSIVAMENTE dentro de la carpeta donde Compose genera los instaladores finales
          # Así evitamos copiar gradlew.exe u otras cosas por error.
          
          $msi = Get-ChildItem -Path composeApp\build\compose\binaries -Filter *.msi -Recurse | Select-Object -First 1
          if ($msi) { 
              Copy-Item $msi.FullName -Destination "artifacts\TicTacToe-${{ github.ref_name }}.msi" 
              Write-Host "Encontrado y copiado: $($msi.FullName)"
          }

          $exe = Get-ChildItem -Path composeApp\build\compose\binaries -Filter *.exe -Recurse | Select-Object -First 1
          if ($exe) { 
              Copy-Item $exe.FullName -Destination "artifacts\TicTacToe-${{ github.ref_name }}.exe"
              Write-Host "Encontrado y copiado: $($exe.FullName)"
          }

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: artifacts/

  release:
    needs: build-desktop
    runs-on: ubuntu-latest
    
    # 👈 Esto es VITAL para que el bot de GitHub tenga permiso para publicar la Release
    permissions:
      contents: write 

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-installers
          path: ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: |
            ./artifacts/*.msi
            ./artifacts/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}