name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # --- JOB 1: WINDOWS (MSI y EXE) ---
  build-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install WiX Toolset
        run: |
          choco install wixtoolset -y
          refreshenv

      - name: Build Windows Installers
        shell: cmd
        run: .\gradlew.bat :composeApp:packageMsi :composeApp:packageExe

      - name: Rename installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          $msi = Get-ChildItem -Path composeApp\build\compose\binaries\main\msi\*.msi | Select-Object -First 1
          $exe = Get-ChildItem -Path composeApp\build\compose\binaries\main\exe\*.exe | Select-Object -First 1
          if ($msi) { Copy-Item $msi.FullName -Destination "artifacts\TicTacToe-${{ github.ref_name }}.msi" }
          if ($exe) { Copy-Item $exe.FullName -Destination "artifacts\TicTacToe-${{ github.ref_name }}.exe" }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: artifacts/*

  # --- JOB 2: PUBLICAR RELEASE ---
  release:
    needs: [build-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-installers

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            *.msi
            *.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
