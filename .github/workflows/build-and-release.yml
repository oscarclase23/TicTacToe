name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:

  # ---------- JOB 1: BUILD WINDOWS ----------
  build-desktop:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'


      - name: Install WiX Toolset
        run: |
          choco install wixtoolset -y
          refreshenv


      # 🔧 GENERA MSI + EXE (IMPORTANTE)
      - name: Build Windows Installers
        shell: cmd
        run: |
          .\gradlew.bat clean
          .\gradlew.bat :composeApp:packageMsi
          .\gradlew.bat :composeApp:packageExe


      # 🔧 PREPARAR ARCHIVOS PARA RELEASE
      - name: Prepare Windows Artifacts
        shell: pwsh
        run: |

          New-Item -ItemType Directory -Force -Path artifacts


          Write-Host "Buscando MSI..."

          Get-ChildItem `
            -Path composeApp\build\compose\binaries `
            -Filter *.msi `
            -Recurse `
            -ErrorAction SilentlyContinue | ForEach-Object {

              Copy-Item $_.FullName `
              -Destination "artifacts\TicTacToe-${{ github.ref_name }}.msi"

              Write-Host "MSI encontrado:"
              Write-Host $_.FullName
          }



          Write-Host "Buscando EXE..."

          Get-ChildItem `
            -Path composeApp\build\compose\binaries `
            -Filter *.exe `
            -Recurse `
            -ErrorAction SilentlyContinue | ForEach-Object {

              Copy-Item $_.FullName `
              -Destination "artifacts\TicTacToe-${{ github.ref_name }}.exe"

              Write-Host "EXE encontrado:"
              Write-Host $_.FullName
          }


          Write-Host "Archivos preparados:"
          Get-ChildItem artifacts


      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: artifacts/*



  # ---------- JOB 2: CREATE RELEASE ----------
  release:

    needs: build-desktop

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-installers


      - name: Show Files
        run: ls -la


      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            *.msi
            *.exe

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}