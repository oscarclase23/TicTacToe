name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # --- JOB 1: WINDOWS (MSI y EXE) ---
  build-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install WiX Toolset
        run: |
          choco install wixtoolset -y
          refreshenv

      - name: Build Windows Installers
        shell: cmd
        run: .\gradlew.bat :composeApp:packageMsi :composeApp:packageDistributionForCurrentOS

      # Preparar artefactos para release
      - name: Prepare Windows Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          # Buscar .msi en la carpeta msi
          $msiFiles = Get-ChildItem -Path composeApp\build\compose\binaries\main\msi -Filter "*.msi" -Recurse -ErrorAction SilentlyContinue
          foreach ($file in $msiFiles) {
            Copy-Item $file.FullName -Destination "artifacts\TicTacToe-${{ github.ref_name }}.msi"
            Write-Host "Copiado: $($file.FullName)"
          }
          # Buscar .exe en distributions (directorio portable)
          $exeFiles = Get-ChildItem -Path composeApp\build\compose\distributions -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue
          foreach ($file in $exeFiles) {
            Copy-Item $file.FullName -Destination "artifacts\TicTacToe-${{ github.ref_name }}.exe"
            Write-Host "Copiado: $($file.FullName)"
          }
          # También buscar en app (en algunos casos)
          $appExe = Get-ChildItem -Path composeApp\build\compose\binaries\main\app -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue
          foreach ($file in $appExe) {
            Copy-Item $file.FullName -Destination "artifacts\TicTacToe-${{ github.ref_name }}.exe"
            Write-Host "Copiado: $($file.FullName)"
          }
          # Listar lo que se preparó
          Write-Host "Artefactos preparados:"
          Get-ChildItem -Path artifacts -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: artifacts/*

  # --- JOB 2: PUBLICAR RELEASE ---
  release:
    needs: [build-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-installers

      - name: List Downloaded Files
        run: ls -la

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            *.msi
            *.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
